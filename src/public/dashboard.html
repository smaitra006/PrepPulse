<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepPulse | Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 antialiased hidden" id="app-body">
    <div class="flex h-screen overflow-hidden">

        <aside class="w-64 bg-white border-r border-gray-200 hidden md:flex flex-col">
            <div class="h-16 flex items-center px-6 border-b border-gray-200">
                <h1 class="text-xl font-bold text-brand-900 tracking-tight">PrepPulse.</h1>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <a href="/dashboard.html" class="flex items-center px-3 py-2.5 bg-brand-50 text-brand-600 rounded-lg font-medium">
                    📊 Dashboard
                </a>
                <a href="/library.html" class="flex items-center px-3 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg font-medium transition-colors">
                    📚 Problem Library
                </a>
                <a href="/tracking.html" class="flex items-center px-3 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg font-medium transition-colors">
                    ✅ My Tracking
                </a>
                <a href="/applications.html" class="flex items-center px-3 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg font-medium transition-colors">
                    🏢 Job Applications
                </a>
            </nav>
            <div class="p-4 border-t border-gray-200">
                <button id="logout-btn" class="w-full px-3 py-2 text-sm font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors">
                    Sign Out
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-hidden relative">

            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sm:px-8">
                <h2 class="text-lg font-semibold text-gray-800">Overview</h2>
                <div class="flex items-center gap-3">
                    <span class="text-sm text-gray-500">Welcome,</span>
                    <span id="user-greeting" class="text-sm font-semibold text-gray-900">...</span>
                    <div class="h-8 w-8 rounded-full bg-brand-100 flex items-center justify-center text-brand-600 font-bold" id="user-avatar">
                        ?
                    </div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-6 sm:p-8">

                <div id="loading-state" class="flex items-center justify-center h-64">
                    <p class="text-gray-500 font-medium animate-pulse">Compiling your stats...</p>
                </div>

                <div id="dashboard-content" class="hidden space-y-6">

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                            <h3 class="text-sm font-medium text-gray-500">Problems Solved</h3>
                            <p class="mt-2 text-3xl font-bold text-gray-900" id="stat-solved">0</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                            <h3 class="text-sm font-medium text-gray-500">Needs Revision</h3>
                            <p class="mt-2 text-3xl font-bold text-orange-600" id="stat-revisiting">0</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                            <h3 class="text-sm font-medium text-gray-500">Active Applications</h3>
                            <p class="mt-2 text-3xl font-bold text-brand-600" id="stat-applications">0</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                            <h3 class="text-base font-semibold text-gray-900 mb-4">Topic Progress</h3>
                            <div id="topic-list" class="space-y-4">
                                </div>
                        </div>

                        <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                            <h3 class="text-base font-semibold text-gray-900 mb-4">Upcoming Deadlines</h3>
                            <div id="deadline-list" class="space-y-3">
                                </div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="/js/dashboard.js"></script>
</body>
</html>

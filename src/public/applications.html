<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepPulse | Job Applications</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 antialiased hidden" id="app-body">
    <div class="flex h-screen overflow-hidden">

        <aside class="w-64 bg-white border-r border-gray-200 hidden md:flex flex-col">
            <div class="h-16 flex items-center px-6 border-b border-gray-200">
                <h1 class="text-xl font-bold text-brand-900 tracking-tight">PrepPulse.</h1>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <a href="/dashboard.html" class="flex items-center px-3 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg font-medium transition-colors">
                    📊 Dashboard
                </a>
                <a href="/library.html" class="flex items-center px-3 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg font-medium transition-colors">
                    📚 Problem Library
                </a>
                <a href="/tracking.html" class="flex items-center px-3 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg font-medium transition-colors">
                    ✅ My Tracking
                </a>
                <a href="/applications.html" class="flex items-center px-3 py-2.5 bg-brand-50 text-brand-600 rounded-lg font-medium">
                    🏢 Job Applications
                </a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sm:px-8">
                <h2 class="text-lg font-semibold text-gray-800">Application Pipeline Tracker</h2>
                <button id="open-add-modal-btn" class="px-4 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-500 rounded-lg transition-colors shadow-sm">
                    + Track New Role
                </button>
            </header>

            <div class="flex-1 overflow-y-auto p-6 sm:p-8">
                <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center">
                    <select id="pipeline-filter" class="input-field sm:max-w-xs bg-white">
                        <option value="">All Pipeline Stages</option>
                        <option value="not applied">Not Applied</option>
                        <option value="applied">Applied</option>
                        <option value="OA pending">OA Pending</option>
                        <option value="interview scheduled">Interview Scheduled</option>
                        <option value="rejected">Rejected</option>
                        <option value="offer received">Offer Received</option>
                    </select>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-gray-50 border-b border-gray-200 text-gray-600">
                                <tr>
                                    <th class="px-6 py-4 font-semibold">Company</th>
                                    <th class="px-6 py-4 font-semibold">Target Role</th>
                                    <th class="px-6 py-4 font-semibold">Priority</th>
                                    <th class="px-6 py-4 font-semibold">Status Stage</th>
                                    <th class="px-6 py-4 font-semibold">Deadline</th>
                                    <th class="px-6 py-4 font-semibold text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="applications-tbody" class="divide-y divide-gray-200">
                                <tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">Loading Application Workspace...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="add-modal" class="fixed inset-0 z-50 hidden bg-gray-900/50 items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 relative">
            <h3 class="text-xl font-bold text-gray-900 mb-4">Track Application</h3>
            <form id="add-application-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Target Company</label>
                    <select id="add-company-id" required class="input-field"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Role / Position Title</label>
                    <input type="text" id="add-role" required class="input-field" placeholder="e.g. Software Engineer Intern">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Pipeline Stage</label>
                        <select id="add-status" class="input-field">
                            <option value="not applied">Not Applied</option>
                            <option value="applied">Applied</option>
                            <option value="OA pending">OA Pending</option>
                            <option value="interview scheduled">Interview Scheduled</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Priority Track</label>
                        <select id="add-priority" class="input-field">
                            <option value="Low">Low Priority</option>
                            <option value="Medium" selected>Medium Priority</option>
                            <option value="High">High Priority</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Applied Date</label>
                        <input type="date" id="add-applied-date" class="input-field">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Deadline Date</label>
                        <input type="date" id="add-deadline" class="input-field">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Context Notes</label>
                    <textarea id="add-notes" rows="2" class="input-field resize-none" placeholder="Add updates or links..."></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" id="close-add-btn" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-500 rounded-lg transition-colors">Log Role</button>
                </div>
            </form>
        </div>
    </div>

    <div id="update-modal" class="fixed inset-0 z-50 hidden bg-gray-900/50 items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 relative">
            <h3 class="text-xl font-bold text-gray-900 mb-1">Advance Pipeline</h3>
            <p id="update-modal-context" class="text-sm text-gray-500 mb-4"></p>
            <form id="update-application-form" class="space-y-4">
                <input type="hidden" id="update-app-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Pipeline Stage Status</label>
                    <select id="update-status" class="input-field">
                        <option value="not applied">Not Applied</option>
                        <option value="applied">Applied</option>
                        <option value="OA pending">OA Pending</option>
                        <option value="interview scheduled">Interview Scheduled</option>
                        <option value="rejected">Rejected</option>
                        <option value="offer received">Offer Received</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Applied Date</label>
                        <input type="date" id="update-applied-date" class="input-field">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Deadline Date</label>
                        <input type="date" id="update-deadline" class="input-field">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Priority Track</label>
                    <select id="update-priority" class="input-field">
                        <option value="Low">Low Priority</option>
                        <option value="Medium">Medium Priority</option>
                        <option value="High">High Priority</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Updates / Notes</label>
                    <textarea id="update-notes" rows="2" class="input-field resize-none"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" id="close-update-btn" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-500 rounded-lg transition-colors">Apply Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/applications.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepPulse | Problem Library</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 antialiased hidden" id="app-body">
    <div class="flex h-screen overflow-hidden">

        <aside class="w-64 bg-white border-r border-gray-200 hidden md:flex flex-col">
            <div class="h-16 flex items-center px-6 border-b border-gray-200">
                <h1 class="text-xl font-bold text-brand-900 tracking-tight">PrepPulse.</h1>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <a href="/dashboard.html" class="flex items-center px-3 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg font-medium transition-colors">
                    📊 Dashboard
                </a>
                <a href="/library.html" class="flex items-center px-3 py-2.5 bg-brand-50 text-brand-600 rounded-lg font-medium">
                    📚 Problem Library
                </a>
                <a href="/tracking.html" class="flex items-center px-3 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg font-medium transition-colors">
                    ✅ My Tracking
                </a>
                <a href="/applications.html" class="flex items-center px-3 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-gray-900 rounded-lg font-medium transition-colors">
                    🏢 Job Applications
                </a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-hidden relative">

            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sm:px-8">
                <h2 class="text-lg font-semibold text-gray-800">Global Library</h2>
            </header>

            <div class="flex-1 overflow-y-auto p-6 sm:p-8">

                <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center">
                    <input type="text" id="search-input" placeholder="Search problems..." class="input-field sm:max-w-xs bg-white">

                    <select id="topic-filter" class="input-field sm:max-w-xs bg-white">
                        <option value="">All Topics</option>
                        </select>

                    <select id="difficulty-filter" class="input-field sm:max-w-xs bg-white">
                        <option value="">All Difficulties</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-gray-50 border-b border-gray-200 text-gray-600">
                                <tr>
                                    <th class="px-6 py-4 font-semibold">Problem Title</th>
                                    <th class="px-6 py-4 font-semibold">Topic</th>
                                    <th class="px-6 py-4 font-semibold">Difficulty</th>
                                    <th class="px-6 py-4 font-semibold text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="problems-tbody" class="divide-y divide-gray-200">
                                <tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">Loading library...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="tracking-modal" class="fixed inset-0 z-50 hidden bg-gray-900/50 items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 relative">
            <h3 class="text-xl font-bold text-gray-900 mb-1">Update Status</h3>
            <p id="modal-problem-title" class="text-sm text-gray-500 mb-6">Problem Name</p>

            <form id="tracking-form" class="space-y-4">
                <input type="hidden" id="modal-problem-id">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Current Status</label>
                    <select id="modal-status" class="input-field">
                        <option value="unsolved">Unsolved</option>
                        <option value="solved">Solved</option>
                        <option value="revisiting">Needs Revision</option>
                        <option value="bookmarked">Bookmarked</option>
                        <option value="skipped">Skipped</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Notes (Optional)</label>
                    <textarea id="modal-notes" rows="3" class="input-field resize-none" placeholder="E.g., Used a HashMap for O(N) time..."></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" id="close-modal-btn" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-500 rounded-lg transition-colors">Save Progress</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/library.js"></script>
</body>
</html>
